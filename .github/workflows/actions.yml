  windows:
    needs: [ what-to-make ]
    if: ${{ needs.what-to-make.outputs.make-cli == 'true' || needs.what-to-make.outputs.make-daemon == 'true' || needs.what-to-make.outputs.make-dist == 'true' || needs.what-to-make.outputs.make-qt == 'true' || needs.what-to-make.outputs.make-tests == 'true' || needs.what-to-make.outputs.make-utils == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        # IPO only on the x64 reference cell: it carries the LTO coverage
        # and the release-shaped artifacts. The other cells build without
        # it -- no /LTCG time on throwaway binaries, and since the flag is
        # the same on push and PR, main's ccache snapshots warm PR builds.
        include:
          - arch: x86
            ipo: 'OFF'
            runner: windows-2022
            publish: true
          - arch: x64
            ipo: 'ON'
            runner: windows-2022
            publish: true
          # Coverage-only (newer toolchain, extra warnings). Not published: its
          # MSI would require a VC++ redist too new for most machines.
          - arch: x64
            ipo: 'OFF'
            runner: windows-2025-vs2026
          - arch: arm64
            ipo: 'OFF'
            runner: windows-11-arm
            publish: true
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Show Configuration
        run: |
          echo '${{ toJSON(needs) }}'
          echo '${{ toJSON(runner) }}'
      - name: Get Source
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Prepare Build Deps
        uses: ./.github/actions/prepare-deps-win32
        with:
          arch: ${{ matrix.arch }}
          type: Deps
      - name: Setup Visual Studio Environment
        uses: ./.github/actions/setup-vs-env-win32
        with:
          arch: ${{ matrix.arch }}
      - name: Setup ccache
        uses: ./.github/actions/setup-ccache
        with:
          key-suffix: ${{ matrix.arch }}-${{ matrix.runner }}-ipo-${{ matrix.ipo }}
      - name: Configure
        run: |
          $CmakeArgs = @(
            '-S .'
            '-B obj'
            '-G Ninja'
            '-DCMAKE_C_COMPILER_LAUNCHER=ccache'
            '-DCMAKE_CXX_COMPILER_LAUNCHER=ccache'
            # ccache cannot cache /Zi; store debug info in the objects (/Z7) instead
            '-DCMAKE_POLICY_DEFAULT_CMP0141=NEW'
            '-DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded'
            '-DCMAKE_BUILD_TYPE=RelWithDebInfo'
            '-DCMAKE_INSTALL_PREFIX=pfx'
            "-DCMAKE_PREFIX_PATH=`"$Env:DEPS_PREFIX`""
            "-DENABLE_CLI=${{ (needs.what-to-make.outputs.make-cli == 'true') && 'ON' || 'OFF' }}"
            "-DENABLE_DAEMON=${{ (needs.what-to-make.outputs.make-daemon == 'true' || needs.what-to-make.outputs.make-dist == 'true') && 'ON' || 'OFF' }}"
            '-DENABLE_GTK=OFF'
            "-DENABLE_IPO=${{ matrix.ipo }}"
            '-DENABLE_MAC=OFF'
            "-DENABLE_QT=${{ (needs.what-to-make.outputs.make-dist == 'true' || needs.what-to-make.outputs.make-qt == 'true') && 'ON' || 'OFF' }}"
            "-DENABLE_TESTS=${{ (needs.what-to-make.outputs.make-tests == 'true') && 'ON' || 'OFF' }}"
            '-DENABLE_UTILS=ON'
            '-DREBUILD_WEB=OFF'
            '-DENABLE_WERROR=ON'
            '-DRUN_CLANG_TIDY=OFF'
            '-DUSE_SYSTEM_DEFAULT=OFF'
          )
          cmd /c "`"$Env:VCVARSALL`" $Env:VC_ARCH >nul && cmake $($CmakeArgs -join ' ')"
      - name: Make
        run: |
          cmd /c "`"$Env:VCVARSALL`" $Env:VC_ARCH >nul && cmake --build obj --config RelWithDebInfo"
      - name: Test
        if: ${{ needs.what-to-make.outputs.make-tests == 'true' }}
        uses: ./.github/actions/run-tests
        with:
          build-dir: obj
          build-config: RelWithDebInfo
          timeout: 600
      - name: Install
        run: cmake --install obj --config RelWithDebInfo
      - name: Get Packaging Tools
        if: ${{ needs.what-to-make.outputs.make-dist == 'true' || (needs.what-to-make.outputs.make-daemon == 'true' && needs.what-to-make.outputs.make-qt == 'true') }}
        run: |
          choco install wixtoolset
          (Join-Path (Get-Item -Path "${Env:ProgramFiles(x86)}\WiX Toolset v3.*")[0].FullName bin) | Out-File $Env:GITHUB_PATH -Append
      - name: Package
        if: ${{ matrix.publish && (needs.what-to-make.outputs.make-dist == 'true' || (needs.what-to-make.outputs.make-daemon == 'true' && needs.what-to-make.outputs.make-qt == 'true')) }}
        run: |
          cmd /c "`"$Env:VCVARSALL`" $Env:VC_ARCH >nul && cmake --build obj --config RelWithDebInfo --target pack-msi"
      - uses: actions/upload-artifact@v6
        if: ${{ matrix.publish }}
        with:
          name: binaries-${{ github.job }}-${{ matrix.arch }}-${{ matrix.runner }}
          path: pfx/**/*
      - uses: actions/upload-artifact@v6
        if: ${{ matrix.publish }}
        with:
          name: binaries-${{ github.job }}-${{ matrix.arch }}-${{ matrix.runner }}-msi
          path: obj/dist/msi/*.msi
      - name: Finalize ccache
        uses: ./.github/actions/finalize-ccache
        with:
          trim-age: 3d

