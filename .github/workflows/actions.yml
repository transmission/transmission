          - version: oldoldstable
            gtk: gtk3
            qt: qt5
            use-legacy-packages: true
          - version: stable
            gtk: gtk4
            qt: qt6
            use-legacy-packages: false
          - version: unstable
            gtk: gtk4
            qt: qt6
            use-legacy-packages: false
